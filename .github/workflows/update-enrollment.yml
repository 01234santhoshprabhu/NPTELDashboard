name: Update enrollment report

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pandas requests

      - name: Update report data
        run: python update_github_report.py

      - name: Commit refreshed dashboard data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update enrollment dashboard data"
          file_pattern: docs/enrollment_report.csv docs/summary.json
