name: Update enrollment report

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pandas requests

      - name: Update report data
        run: python update_github_report.py

      - name: Preserve latest member data
        run: |
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/member_summary.json -o docs/member_summary.json || true
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/member_counts.csv -o docs/member_counts.csv || true
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/daily_log.json -o docs/daily_log.json || true

      - name: Commit refreshed dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/enrollment_report.csv docs/summary.json docs/member_summary.json docs/member_counts.csv docs/daily_log.json docs/test.html || true
          if git diff --cached --quiet; then
            echo "No refreshed dashboard data changes to commit."
          else
            git commit -m "Update enrollment dashboard data"
            git push
          fi

      - name: Publish refreshed dashboard
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./docs
