services:
  - type: web
    name: nptel-dashboard-login
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nptel-dashboard-db
          property: connectionString
      - key: ADMIN_EMAIL
        value: admin@nptel.local
      - key: ADMIN_PASSWORD
        value: ChangeMe123!
      - key: PUBLIC_DASHBOARD_BASE_URL
        value: https://01234santhoshprabhu.github.io/NPTELDashboard/
      - key: USE_REMOTE_DASHBOARD_ASSETS
        value: "true"
      - key: SCHEDULER_TIMEZONE
        value: Asia/Kolkata

databases:
  - name: nptel-dashboard-db
    plan: free
